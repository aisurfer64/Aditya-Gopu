<section id="contact" class="contact">
	<div class="contact-upper mobile">
		<span class="contact-mobile">Have a project in mind? Or you want to say hello,</span>
		<span class="contact-mobile">
			<span class="white">
				<span class="hover hover--white">get in touch.</span>
			</span>
		</span>
	</div>

	<div class="contact-upper desktop">
		<span class="contact-header">Have a project in mind?</span>
		<span class="contact-header">Or you want to say hello,</span>
		<span class="contact-header">
			<span class="white">
				<span class="hover hover--white">get in touch</span>
			</span>
			<span>with me.</span>
		</span>
	</div>

	<div class="contact-lower">
		<span class="date contact-date contact-header">©2024</span>

		<div class="contact-socials">
			<div class="flex-spacing">
				<div class="flex">
					<span>Socials</span>
				</div>

				<div class="flex">
					<a class="hover" href="https://www.instagram.com/aditya_gopu14/">Instagram</a>
					<a class="hover" href="https://github.com/aisurfer64">Github</a>
				</div>
			</div>

			<div class="flex-spacing">
				<div class="flex">
					<span>Developed</span>
					<span>By</span>
				</div>
				<div class="flex">
					<span>Aditya</span>
					<span>Gopu</span>
				</div>
			</div>

			<span class="back-top">
				<span class="underline">Back on top</span>
				<span>↑</span>
			</span>
		</div>

		<div class="contact-lower__image">
			<picture class="contact-image-bg">
				<source srcset="images/contact/medium/1x2.avif" media="(min-width: 2560px)" />
				<source
					srcset="images/contact/small/1x1.avif"
					media="(min-width: 601px) and (max-width: 2559px)"
				/>
				<img
					class="contact-image"
					src="images/contact/small/1x1.avif"
					alt="Mobile orange background"
					loading="lazy"
				/>
			</picture>
			<div class="contact-link">
				<span class="contact-link__text hover">Contact</span>
				<span>+</span>
			</div>
		</div>
	</div>
</section>
