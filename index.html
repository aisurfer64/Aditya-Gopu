<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal website of Aditya Gopu - Coming Soon.">
  <title>Aditya Gopu | Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(18, 20, 29, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(120, 119, 198, 0.35);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --secondary: #a855f7;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --status-green: #10b981;
      --status-green-glow: rgba(16, 185, 129, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* Ambient Background Glows */
    .bg-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
      animation: floatGlow 14s ease-in-out infinite alternate;
    }

    .glow-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
      top: -100px;
      left: -100px;
    }

    .glow-2 {
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, var(--secondary) 0%, transparent 70%);
      bottom: -120px;
      right: -100px;
      animation-delay: -7s;
    }

    .glow-3 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.2;
    }

    /* Subtle grid overlay */
    .grid-pattern {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      z-index: 1;
      pointer-events: none;
    }

    /* Main Container Card */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      transition: border-color 0.4s ease, transform 0.4s ease, box-shadow 0.4s ease;
    }

    .card:hover {
      border-color: var(--card-border-hover);
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.6),
        0 0 40px rgba(99, 102, 241, 0.12);
    }

    /* Status Pill */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #6ee7b7;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--status-green);
      box-shadow: 0 0 10px var(--status-green);
      position: relative;
    }

    .status-dot::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: var(--status-green);
      opacity: 0.4;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    /* Name & Title */
    .author-name {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff 30%, #c4b5fd 75%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .description {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 36px;
      font-weight: 400;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Progress Bar Element */
    .progress-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 36px;
      text-align: left;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 500;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 65%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
      background-size: 200% 100%;
      animation: shimmer 3s infinite linear;
    }

    /* Social / Action Links */
    .links-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.9) 0%, rgba(168, 85, 247, 0.9) 100%);
      color: #ffffff;
      box-shadow: 0 4px 18px var(--primary-glow);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(99, 102, 241, 0.55);
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Footer Note */
    .footer-note {
      margin-top: 32px;
      font-size: 0.8rem;
      color: rgba(148, 163, 184, 0.6);
    }

    /* Keyframe Animations */
    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.12); }
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.8); opacity: 0; }
      100% { transform: scale(0.9); opacity: 0; }
    }

    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    @media (max-width: 480px) {
      .card {
        padding: 36px 24px;
      }
      .links-group {
        flex-direction: column;
        width: 100%;
      }
      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="bg-glow glow-1" aria-hidden="true"></div>
  <div class="bg-glow glow-2" aria-hidden="true"></div>
  <div class="bg-glow glow-3" aria-hidden="true"></div>
  <div class="grid-pattern" aria-hidden="true"></div>

  <main class="card" id="main-content">
    <div class="status-badge" id="status-badge">
      <span class="status-dot"></span>
      <span>In Active Development</span>
    </div>

    <p class="author-name">Aditya Gopu</p>
    <h1 id="headline">Website is coming now.</h1>
    
    <p class="description">
      Currently designing and engineering a new digital space. The complete personal website will launch shortly.
    </p>

    <div class="progress-box" aria-label="Development status">
      <div class="progress-header">
        <span>Portfolio Buildout</span>
        <span>Crafting in progress</span>
      </div>
      <div class="progress-track" role="progressbar" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-fill"></div>
      </div>
    </div>

    <div class="links-group">
      <a href="https://github.com/aisurfer64" target="_blank" rel="noopener noreferrer" class="btn btn-primary" id="github-link">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>GitHub Profile</span>
      </a>
      <a href="https://github.com/aisurfer64/Aditya-Gopu" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" id="repo-link">
        <span>View Repository</span>
      </a>
    </div>

    <p class="footer-note">
      &copy; <span id="year"></span> Aditya Gopu &bull; All rights reserved
    </p>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
